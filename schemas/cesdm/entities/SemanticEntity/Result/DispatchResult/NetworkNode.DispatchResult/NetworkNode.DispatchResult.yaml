name: NetworkNode.DispatchResult
parents:
- DispatchResult
description: |
  Hourly dispatch result for NetworkNode entities (ElectricalBus, GasBus,
  HeatBus, etc.). Captures the nodal price time series and scalar statistics
  (average, min, max). The nodal price is the dual variable of the energy balance
  constraint at the node.
relations:
- id: reportsOn
  required: true
  target: NetworkNode
- id: hasNodalPriceProfile
  required: false
  target: Profile
attributes:
- id: average_nodal_price
  required: false
- id: min_nodal_price
  required: false
- id: max_nodal_price
  required: false
