name: GenerationUnit
parents:
- EnergyAssetInstance
description: >
  Deployed generation asset with topology, dispatch, and optional dynamics data.
  Technology-specific design attributes live on subclasses (Hydro-, Wind-, Solar-,
  ThermalGenerationUnit); shared dispatch/topology fields stay here.

  Carrier rule: the injected carrier is implied by atNode → CarrierDomain when a
  single-carrier bus is attached. Optional hasInputCarrier / hasOutputCarrier are
  overrides for imports or multi-fuel cases. Bus classification (PQ/PV/slack) lives
  on ElectricalBus.powerflow_bus_type, not on the generator.

relations:
- id: usesDynamicModelType
  required: false
  belongsToGroup:
  - dynamics
  target: DynamicMachineModelType
- id: hasTechnology
  required: false
  target: GeneratorType
- id: hasInputResource
  required: false
  target: NaturalResource
- id: hasInputCarrier
  required: false
  target: Carrier
- id: hasOutputCarrier
  required: false
  target: Carrier
- id: hasAvailabilityProfile
  required: false
  belongsToGroup:
  - dispatch
- id: atNode
  required: false
  belongsToGroup:
  - topology
- id: hasAutomaticVoltageRegulator
  required: false
  belongsToGroup:
  - dynamics
- id: hasTurbineGovernor
  required: false
  belongsToGroup:
  - dynamics
- id: hasPowerSystemStabilizer
  required: false
  belongsToGroup:
  - dynamics
