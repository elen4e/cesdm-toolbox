name: GasTransmission
parents:
- TransmissionElement
abstract: true
description: >
  Abstract gas transmission branch within a gas CarrierDomain. Pipe leaves come later; capacity-only transfers
  use GenericInterconnector.

  Water/hydro cascades are modelled with HydraulicStorageUnit + HydroGenerationUnit, not here.
relations:
- id: fromNode
  required: false
  belongsToGroup: [topology]
  target: GasBus
- id: toNode
  required: false
  belongsToGroup: [topology]
  target: GasBus
