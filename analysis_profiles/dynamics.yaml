# Analysis profile: machine dynamics
#
# What a dynamic simulation needs on reusable synchronous-machine model
# types and concrete AVR/GOV/PSS controllers. Schema marks these
# belongsToGroup: [dynamics] fields as optional so bare models validate;
# this profile is where the study-level requirements live.
#
# Load and run with:
#   errors = model.validate_for_analysis("dynamics")

name: dynamics
description: >
  Minimum attribute requirements for synchronous-machine dynamic model
  types and controllers used in transient / RMS dynamics studies.

requirements:

  - entity_class: DynamicMachineModelType.Synchronous
    checks:
      - attribute: machine_model_order
        required: true

      - attribute: inertia_constant
        required: true
        constraints:
          minimum: 0

      - attribute: d_axis_synchronous_reactance
        required: true
        constraints:
          minimum: 0

      - attribute: q_axis_synchronous_reactance
        required: true
        constraints:
          minimum: 0

      - attribute: d_axis_transient_reactance
        required: true
        constraints:
          minimum: 0

      - attribute: d_axis_transient_open_circuit_time_constant
        required: true
        constraints:
          minimum: 0

      - attribute: d_axis_subtransient_reactance
        required: true
        constraints:
          minimum: 0

      - attribute: q_axis_subtransient_reactance
        required: true
        constraints:
          minimum: 0

      - attribute: d_axis_subtransient_open_circuit_time_constant
        required: true
        constraints:
          minimum: 0

      - attribute: q_axis_subtransient_open_circuit_time_constant
        required: true
        constraints:
          minimum: 0

