<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Exogenous carrier domain</title>
  <desc id="desc">Natural gas is supplied from outside the system boundary. Only the gas turbine conversion unit and the electricity network are modelled in detail.</desc>
  <defs>
    <style>
      .title { font: 700 22px Inter, Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
      .domain-label { font: 700 15px Inter, Arial, sans-serif; fill: #0F172A; }
      .label { font: 600 14px Inter, Arial, sans-serif; fill: #0F172A; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #64748B; }
      .boundary { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 8 6; }
      .external { fill: #FEF3C7; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 6 4; }
      .elec-domain { fill: #ECFEFF; stroke: #06B6D4; stroke-width: 2; }
      .conversion { fill: #F8FAFC; stroke: #6366F1; stroke-width: 2; }
      .elec-node { fill: #FFFFFF; stroke: #0891B2; stroke-width: 2; }
      .asset { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 2; }
      .line { stroke: #0891B2; stroke-width: 4; stroke-linecap: round; fill: none; }
      .flow { stroke: #6366F1; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .external-flow { stroke: #D97706; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-gas); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6366F1"/>
    </marker>
    <marker id="arrow-gas" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="18" fill="#F8FAFC"/>
  <text x="380" y="34" text-anchor="middle" class="title">Exogenous - external supply only</text>
  <text x="380" y="56" text-anchor="middle" class="subtitle">Carrier supplied from outside; only the receiving side is modelled in detail</text>

  <rect x="250" y="78" width="260" height="56" rx="14" class="external"/>
  <text x="380" y="104" text-anchor="middle" class="label">External natural gas</text>
  <text x="380" y="122" text-anchor="middle" class="tiny">Outside system model</text>

  <rect x="40" y="150" width="680" height="238" rx="16" class="boundary"/>
  <text x="56" y="170" class="tiny">System model boundary</text>

  <path d="M380 134 L380 188" class="external-flow"/>

  <rect x="310" y="188" width="140" height="52" rx="12" class="conversion"/>
  <text x="380" y="212" text-anchor="middle" class="label">Gas turbine</text>
  <text x="380" y="228" text-anchor="middle" class="tiny">ConversionUnit</text>

  <path d="M380 240 L380 258" class="flow"/>
  <rect x="70" y="258" width="620" height="110" rx="14" class="elec-domain"/>
  <text x="90" y="280" class="domain-label">Electricity carrier domain</text>
  <text x="620" y="280" text-anchor="end" class="tiny">Endogenous - full network</text>

  <rect x="110" y="300" width="72" height="36" rx="10" class="asset"/>
  <text x="146" y="323" text-anchor="middle" class="tiny">Generator</text>
  <path d="M182 318 L210 318" class="flow"/>
  <circle cx="240" cy="318" r="16" class="elec-node"/>
  <text x="240" y="322" text-anchor="middle" class="tiny">Bus</text>
  <line x1="256" y1="318" x2="340" y2="318" class="line"/>
  <text x="298" y="308" text-anchor="middle" class="tiny">Line</text>
  <circle cx="360" cy="318" r="16" class="elec-node"/>
  <text x="360" y="322" text-anchor="middle" class="tiny">Bus</text>
  <line x1="376" y1="318" x2="460" y2="318" class="line"/>
  <rect x="470" y="300" width="72" height="36" rx="10" class="asset"/>
  <text x="506" y="323" text-anchor="middle" class="tiny">Load</text>

  <path d="M380 240 L380 300" class="flow"/>
</svg>
