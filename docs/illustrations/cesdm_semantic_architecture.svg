<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
<title id="title">CESDM Semantic Architecture</title>
<desc id="desc">External YAML schemas define CESDM semantics. A generic Entity–Attribute–Relation engine applies these definitions through add_entity, add_attribute, and add_relation to construct concrete system models.</desc>
<defs>
<style>
.title{font:700 40px Arial,sans-serif;fill:#17324d}
.subtitle{font:400 20px Arial,sans-serif;fill:#52677b}
.heading{font:700 26px Arial,sans-serif;fill:#17324d}
.label{font:700 18px Arial,sans-serif;fill:#17324d}
.body{font:400 17px Arial,sans-serif;fill:#52677b}
.small{font:400 15px Arial,sans-serif;fill:#52677b}
.code{font:700 17px "Courier New",monospace;fill:#17324d}
.schema{fill:#eaf2f8;stroke:#336f98;stroke-width:3}
.engine{fill:#eef7f5;stroke:#16806f;stroke-width:3}
.model{fill:#fbf8f2;stroke:#b09767;stroke-width:3}
.inner{fill:#fff;stroke:#a9bbc9;stroke-width:2}
.callout{fill:#f4f7fb;stroke:#b9c8d6;stroke-width:2}
.arrow{fill:none;stroke:#426e8c;stroke-width:3.2;marker-end:url(#arrow)}
.divider{stroke:#d9e2ea;stroke-width:2}
</style>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L12,6 L0,12 z" fill="#426e8c"/>
</marker>
</defs>
<rect width="1500" height="1080" fill="#fff"/>
<text x="750" y="58" text-anchor="middle" class="title">CESDM Semantic Architecture</text>
<text x="750" y="94" text-anchor="middle" class="subtitle">Schemas define the semantics, the EAR engine applies them, and system models instantiate them.</text>

<rect x="300" y="140" width="900" height="250" rx="30" class="schema"/>
<text x="750" y="187" text-anchor="middle" class="heading">External YAML Schemas</text>
<text x="750" y="220" text-anchor="middle" class="body">Define the semantic building blocks and validity rules of a CESDM domain</text>
<line x1="370" y1="245" x2="1130" y2="245" class="divider"/>

<rect x="360" y="275" width="220" height="78" rx="17" class="inner"/>
<text x="470" y="308" text-anchor="middle" class="label">Entity Classes</text>
<text x="470" y="333" text-anchor="middle" class="small">what can exist</text>

<rect x="640" y="275" width="220" height="78" rx="17" class="inner"/>
<text x="750" y="308" text-anchor="middle" class="label">Attributes</text>
<text x="750" y="333" text-anchor="middle" class="small">how entities are described</text>

<rect x="920" y="275" width="220" height="78" rx="17" class="inner"/>
<text x="1030" y="308" text-anchor="middle" class="label">Relation Types</text>
<text x="1030" y="333" text-anchor="middle" class="small">how entities are related</text>

<text x="750" y="375" text-anchor="middle" class="small">inheritance • data types • units • cardinalities • constraints • validity ranges • validation rules</text>

<path d="M750 390 L750 500" class="arrow"/>
<rect x="630" y="421" width="240" height="50" rx="16" class="callout"/>
<text x="750" y="453" text-anchor="middle" class="label">define semantics and rules</text>

<rect x="330" y="500" width="840" height="235" rx="30" class="engine"/>
<text x="750" y="547" text-anchor="middle" class="heading">Generic Entity–Attribute–Relation Engine</text>
<text x="750" y="580" text-anchor="middle" class="body">Domain-independent modelling functionality</text>
<line x1="400" y1="607" x2="1100" y2="607" class="divider"/>

<rect x="410" y="635" width="210" height="66" rx="16" class="inner"/>
<text x="515" y="675" text-anchor="middle" class="code">add_entity()</text>

<rect x="645" y="635" width="210" height="66" rx="16" class="inner"/>
<text x="750" y="675" text-anchor="middle" class="code">add_attribute()</text>

<rect x="880" y="635" width="210" height="66" rx="16" class="inner"/>
<text x="985" y="675" text-anchor="middle" class="code">add_relation()</text>

<text x="750" y="720" text-anchor="middle" class="small">The engine contains no hard-coded energy-system semantics.</text>

<path d="M750 735 L750 845" class="arrow"/>
<rect x="655" y="765" width="190" height="50" rx="16" class="callout"/>
<text x="750" y="797" text-anchor="middle" class="label">instantiate the model</text>

<rect x="300" y="845" width="900" height="190" rx="30" class="model"/>
<text x="750" y="892" text-anchor="middle" class="heading">CESDM System Model</text>
<text x="750" y="925" text-anchor="middle" class="body">A concrete physical energy system composed of schema-conformant instances</text>
<line x1="370" y1="950" x2="1130" y2="950" class="divider"/>

<rect x="390" y="972" width="210" height="46" rx="14" class="inner"/>
<text x="495" y="1002" text-anchor="middle" class="label">Entity Instances</text>

<rect x="645" y="972" width="210" height="46" rx="14" class="inner"/>
<text x="750" y="1002" text-anchor="middle" class="label">Attribute Values</text>

<rect x="900" y="972" width="210" height="46" rx="14" class="inner"/>
<text x="1005" y="1002" text-anchor="middle" class="label">Relations</text>

<text x="750" y="1060" text-anchor="middle" class="small">Schemas describe what is valid; the EAR engine constructs concrete system instances accordingly.</text>
</svg>