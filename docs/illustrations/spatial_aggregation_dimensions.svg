<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img"><style>
.title{font:700 30px Inter,Arial,sans-serif;fill:#0F172A}.head{font:700 19px Inter,Arial,sans-serif;fill:#0F172A}.label{font:600 16px Inter,Arial,sans-serif;fill:#0F172A}.small{font:500 13px Inter,Arial,sans-serif;fill:#475569}.line{stroke:#64748B;stroke-width:2.5;fill:none}.dash{stroke-dasharray:7 6}
</style><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748B"/></marker></defs><rect width="1200" height="610" rx="24" fill="#F8FAFC"/><text x="600" y="50" text-anchor="middle" class="title">Independent aggregation dimensions</text>
<g filter="url(#shadow)"><rect x="440" y="95" width="320" height="78" rx="22" fill="#DBEAFE" stroke="#93C5FD"/><rect x="70" y="245" width="240" height="235" rx="22" fill="#E0E7FF" stroke="#A5B4FC"/><rect x="350" y="245" width="240" height="235" rx="22" fill="#D1FAE5" stroke="#6EE7B7"/><rect x="630" y="245" width="240" height="235" rx="22" fill="#FEF3C7" stroke="#FCD34D"/><rect x="910" y="245" width="220" height="235" rx="22" fill="#FCE7F3" stroke="#F9A8D4"/></g>
<text x="600" y="128" text-anchor="middle" class="head">CESDM source model</text><text x="600" y="151" text-anchor="middle" class="small">One detailed model, several study-specific reductions</text>
<path d="M600 173 L190 245 M600 173 L470 245 M600 173 L750 245 M600 173 L1020 245" class="line" marker-end="url(#arrow)"/>
<text x="190" y="282" text-anchor="middle" class="head">Spatial level</text><text x="190" y="320" text-anchor="middle" class="label">disaggregated</text><text x="190" y="350" text-anchor="middle" class="label">NUTS3 / NUTS2</text><text x="190" y="380" text-anchor="middle" class="label">NUTS1 / country</text><text x="190" y="425" text-anchor="middle" class="small">Global default plus</text><text x="190" y="445" text-anchor="middle" class="small">country overrides</text>
<text x="470" y="282" text-anchor="middle" class="head">Technology depth</text><text x="470" y="325" text-anchor="middle" class="label">Generation.Thermal</text><text x="470" y="355" text-anchor="middle" class="label">Generation.Thermal.Gas</text><text x="470" y="405" text-anchor="middle" class="small">Optional hierarchy-based</text><text x="470" y="425" text-anchor="middle" class="small">technology merging</text>
<text x="750" y="282" text-anchor="middle" class="head">Voltage handling</text><text x="750" y="330" text-anchor="middle" class="label">Split by voltage</text><text x="750" y="365" text-anchor="middle" class="label">or merge levels</text><text x="750" y="410" text-anchor="middle" class="small">Controlled independently</text><text x="750" y="430" text-anchor="middle" class="small">from spatial resolution</text>
<text x="1020" y="282" text-anchor="middle" class="head">Geographic filter</text><text x="1020" y="335" text-anchor="middle" class="label">Countries</text><text x="1020" y="370" text-anchor="middle" class="label">or NUTS prefixes</text><text x="1020" y="415" text-anchor="middle" class="small">Retain only the</text><text x="1020" y="435" text-anchor="middle" class="small">required study area</text>
<path d="M190 480 L190 535 L600 535 M470 480 L470 535 M750 480 L750 535 M1020 480 L1020 535 L600 535" class="line"/><path d="M600 535 L600 570" class="line" marker-end="url(#arrow)"/><text x="600" y="596" text-anchor="middle" class="head">Aggregated CESDM model</text></svg>