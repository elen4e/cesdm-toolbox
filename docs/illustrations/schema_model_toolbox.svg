<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img"><style>
.title { font: 700 30px Inter, Arial, sans-serif; fill: #0F172A; }
.label { font: 650 17px Inter, Arial, sans-serif; fill: #0F172A; }
.small { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
.white { fill: #FFFFFF; }
.line { stroke: #64748B; stroke-width: 2.5; fill: none; }
.dash { stroke-dasharray: 8 7; }
</style><defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748B"/></marker>
</defs><rect width="1200" height="510" rx="24" fill="#F8FAFC"/>
<text x="600" y="48" text-anchor="middle" class="title">From schema to validated model</text>
<path d="M600 165 L600 210 M600 315 L600 360" class="line" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="325" y="85" width="550" height="80" rx="22" fill="#E0E7FF" stroke="#A5B4FC"/><rect x="325" y="210" width="550" height="105" rx="22" fill="#D1FAE5" stroke="#6EE7B7"/><rect x="325" y="360" width="550" height="95" rx="22" fill="#DBEAFE" stroke="#93C5FD"/></g>
<text x="600" y="120" text-anchor="middle" class="label">Schemas</text><text x="600" y="145" text-anchor="middle" class="small">Define entities, attributes, relations, units, and constraints</text>
<text x="600" y="252" text-anchor="middle" class="label">Model</text><text x="600" y="278" text-anchor="middle" class="small">Stores concrete energy-system data according to the schema</text>
<text x="600" y="399" text-anchor="middle" class="label">Toolbox</text><text x="600" y="425" text-anchor="middle" class="small">Loads, validates, transforms, imports, and exports the model</text>
</svg>