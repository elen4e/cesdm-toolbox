<rect x="945" y="190" width="205" height="72" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="152" y="220" text-anchor="middle" class="label">Importers</text>
<text x="152" y="245" text-anchor="middle" class="small">PyPSA · TYNDP · …</text>
