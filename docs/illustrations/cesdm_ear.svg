<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Entity, Attribute and Relation</title>
<desc id="desc">An entity in the centre points to a relation on the left and an attribute on the right.</desc>
<style>
.title{font:700 30px Inter,Arial,sans-serif;fill:#0F172A}.label{font:700 19px Inter,Arial,sans-serif;fill:#0F172A}.small{font:500 14px Inter,Arial,sans-serif;fill:#475569}.subtitle{font:500 18px Inter,Arial,sans-serif;fill:#334155}.line{stroke:#2563EB;stroke-width:3.5;fill:none;stroke-linecap:round}
</style>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
</defs>
<rect width="1200" height="430" rx="24" fill="#F8FAFC"/>
<text x="600" y="50" text-anchor="middle" class="title">Entity - Attribute - Relation</text>
<g filter="url(#shadow)">
 <rect x="100" y="145" width="250" height="140" rx="28" fill="#D1FAE5" stroke="#34D399" stroke-width="2"/>
 <rect x="465" y="120" width="270" height="190" rx="34" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2.5"/>
 <rect x="850" y="145" width="250" height="140" rx="28" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
</g>
<text x="225" y="198" text-anchor="middle" class="label">Relation</text>
<text x="225" y="230" text-anchor="middle" class="small">atNode</text>
<text x="225" y="255" text-anchor="middle" class="small">target: bus.ch.1</text>
<text x="600" y="190" text-anchor="middle" class="label">Entity</text>
<text x="600" y="226" text-anchor="middle" class="small">GenerationUnit</text>
<text x="600" y="252" text-anchor="middle" class="small">gen.ch.vs.hydro</text>
<text x="975" y="198" text-anchor="middle" class="label">Attribute</text>
<text x="975" y="230" text-anchor="middle" class="small">nominal_power_capacity</text>
<text x="975" y="255" text-anchor="middle" class="small">1,200 MW</text>
<path d="M465 215 L350 215" class="line" marker-end="url(#arrow)"/>
<path d="M735 215 L850 215" class="line" marker-end="url(#arrow)"/>
<text x="407" y="194" text-anchor="middle" class="small">connects through</text>
<text x="792" y="194" text-anchor="middle" class="small">is described by</text>
<text x="600" y="375" text-anchor="middle" class="subtitle">Schemas define which entities, attributes and relations are valid.</text>
</svg>