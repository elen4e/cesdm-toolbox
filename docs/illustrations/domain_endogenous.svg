<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Endogenous carrier domain</title>
  <desc id="desc">Both gas and electricity networks are modelled inside the system boundary. A gas pipeline feeds a gas turbine conversion unit that connects to the electricity grid.</desc>
  <defs>
    <style>
      .title { font: 700 22px Inter, Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
      .domain-label { font: 700 15px Inter, Arial, sans-serif; fill: #0F172A; }
      .label { font: 600 14px Inter, Arial, sans-serif; fill: #0F172A; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #64748B; }
      .boundary { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 8 6; }
      .gas-domain { fill: #FFFBEB; stroke: #F59E0B; stroke-width: 2; }
      .elec-domain { fill: #ECFEFF; stroke: #06B6D4; stroke-width: 2; }
      .conversion { fill: #F8FAFC; stroke: #6366F1; stroke-width: 2; }
      .node { fill: #FFFFFF; stroke: #D97706; stroke-width: 2; }
      .elec-node { fill: #FFFFFF; stroke: #0891B2; stroke-width: 2; }
      .asset { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 2; }
      .pipe { stroke: #D97706; stroke-width: 4; stroke-linecap: round; fill: none; }
      .line { stroke: #0891B2; stroke-width: 4; stroke-linecap: round; fill: none; }
      .flow { stroke: #6366F1; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .gas-flow { stroke: #D97706; stroke-width: 2.5; fill: none; marker-end: url(#arrow-gas); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6366F1"/>
    </marker>
    <marker id="arrow-gas" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="760" height="420" rx="18" fill="#F8FAFC"/>
  <text x="380" y="34" text-anchor="middle" class="title">Endogenous — model the infrastructure</text>
  <text x="380" y="56" text-anchor="middle" class="subtitle">Domain, nodes, and transport assets are part of your system model</text>

  <rect x="40" y="78" width="680" height="310" rx="16" class="boundary"/>
  <text x="56" y="98" class="tiny">System model boundary</text>

  <rect x="70" y="110" width="620" height="88" rx="14" class="gas-domain"/>
  <text x="90" y="132" class="domain-label">Gas carrier domain</text>

  <circle cx="160" cy="162" r="16" class="node"/>
  <text x="160" y="166" text-anchor="middle" class="tiny">Node</text>
  <line x1="176" y1="162" x2="280" y2="162" class="pipe"/>
  <text x="228" y="152" text-anchor="middle" class="tiny">Pipeline</text>
  <circle cx="300" cy="162" r="16" class="node"/>
  <text x="300" y="166" text-anchor="middle" class="tiny">Node</text>
  <line x1="316" y1="162" x2="420" y2="162" class="pipe"/>
  <circle cx="440" cy="162" r="16" class="node"/>
  <text x="440" y="166" text-anchor="middle" class="tiny">Node</text>

  <path d="M380 198 L380 218" class="flow"/>
  <rect x="310" y="218" width="140" height="52" rx="12" class="conversion"/>
  <text x="380" y="242" text-anchor="middle" class="label">Gas turbine</text>
  <text x="380" y="258" text-anchor="middle" class="tiny">ConversionUnit</text>

  <path d="M380 270 L380 288" class="flow"/>
  <rect x="70" y="288" width="620" height="88" rx="14" class="elec-domain"/>
  <text x="90" y="310" class="domain-label">Electricity carrier domain</text>

  <rect x="110" y="322" width="72" height="36" rx="10" class="asset"/>
  <text x="146" y="345" text-anchor="middle" class="tiny">Generator</text>
  <path d="M182 340 L210 340" class="flow"/>
  <circle cx="240" cy="340" r="16" class="elec-node"/>
  <text x="240" y="344" text-anchor="middle" class="tiny">Bus</text>
  <line x1="256" y1="340" x2="340" y2="340" class="line"/>
  <text x="298" y="330" text-anchor="middle" class="tiny">Line</text>
  <circle cx="360" cy="340" r="16" class="elec-node"/>
  <text x="360" y="344" text-anchor="middle" class="tiny">Bus</text>
  <line x1="376" y1="340" x2="460" y2="340" class="line"/>
  <rect x="470" y="322" width="72" height="36" rx="10" class="asset"/>
  <text x="506" y="345" text-anchor="middle" class="tiny">Load</text>

  <path d="M440 178 L440 218 L380 218" class="gas-flow"/>
</svg>
