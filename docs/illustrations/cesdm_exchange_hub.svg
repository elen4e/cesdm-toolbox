<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">CESDM as a common exchange layer</title><desc id="desc">PyPSA, Calliope, OSeMOSYS, and an in-house framework each exchange data bidirectionally with CESDM through one maintained mapping.</desc>
<style>.title{font:700 30px Inter,Arial,sans-serif;fill:#0F172A}.label{font:600 18px Inter,Arial,sans-serif;fill:#0F172A}.small{font:500 15px Inter,Arial,sans-serif;fill:#475569}.metric{font:600 16px Inter,Arial,sans-serif;fill:#166534}.flow{stroke:#2563EB;stroke-width:3.5;fill:none;stroke-linecap:round}.white{fill:#fff}</style>
