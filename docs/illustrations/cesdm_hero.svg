<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img">
<style>
  .title { font: 700 44px Inter, Arial, sans-serif; fill: #0F172A; }
  .subtitle { font: 500 20px Inter, Arial, sans-serif; fill: #334155; }
  .label { font: 600 17px Inter, Arial, sans-serif; fill: #0F172A; }
  .small { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
  .white { fill: #FFFFFF; }
  .line { stroke: #94A3B8; stroke-width: 2.5; fill: none; }
  .arrow { marker-end: url(#arrow); }
</style>
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EFF6FF"/>
    <stop offset="100%" stop-color="#ECFDF5"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="#64748B"/>
  </marker>
</defs>

<rect width="1200" height="360" rx="28" fill="url(#hero)"/>
<circle cx="1020" cy="75" r="86" fill="#DBEAFE"/>
<circle cx="1100" cy="250" r="115" fill="#D1FAE5"/>
<g filter="url(#shadow)">
  <rect x="90" y="78" width="132" height="132" rx="28" fill="#2563EB"/>
  <circle cx="156" cy="144" r="39" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="156" cy="144" r="9" fill="#FFFFFF"/>
  <path d="M156 95 L156 111 M156 177 L156 193 M107 144 L123 144 M189 144 L205 144" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
</g>
<text x="270" y="135" class="title">CESDM</text>
<text x="270" y="177" class="subtitle">Common Energy System Domain Model</text>
<text x="270" y="230" class="label">Build once · Validate once · Exchange everywhere</text>
<text x="270" y="270" class="small">Schema-driven · Tool-independent · Interoperable · Extensible</text>
</svg>