<text x="600" y="122" text-anchor="middle" class="white" style="font:700 20px Inter,Arial,sans-serif">CESDM repository</text>
<text x="160" y="270" text-anchor="middle" class="label">ear/</text><text x="160" y="298" text-anchor="middle" class="small">Generic EAR engine</text><text x="160" y="320" text-anchor="middle" class="small">Domain independent</text>
<text x="380" y="270" text-anchor="middle" class="label">cesdm/</text><text x="380" y="298" text-anchor="middle" class="small">Energy-system API</text><text x="380" y="320" text-anchor="middle" class="small">and domain logic</text>
