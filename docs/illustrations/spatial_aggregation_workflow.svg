<text x="600" y="128" text-anchor="middle" class="head">1. Load CESDM model and profiles</text><text x="600" y="238" text-anchor="middle" class="head">2. Filter buses and resolve country rules</text><text x="600" y="348" text-anchor="middle" class="head">3. Build aggregated buses and regions</text><text x="600" y="458" text-anchor="middle" class="head">4. Merge assets, branches, and technologies</text><text x="600" y="568" text-anchor="middle" class="head">5. Aggregate and normalize profiles</text><text x="600" y="678" text-anchor="middle" class="head">6. Export CESDM YAML, HDF5, report, and log</text>
