<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200" role="img" aria-labelledby="title desc">
  <title id="title">CESDM modelling workflow</title>
  <desc id="desc">Typical study model lifecycle: define boundary, import library, add assets, attach profiles, validate, export, optionally aggregate, then hand off to analysis tools.</desc>
  <defs>
    <style>
      .title { font: 700 20px Inter, Arial, sans-serif; fill: #0F172A; }
      .step { font: 600 13px Inter, Arial, sans-serif; fill: #0F172A; }
      .optional { font: 500 11px Inter, Arial, sans-serif; fill: #64748B; }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; }
      .box-accent { fill: #EEF7F5; stroke: #16806F; stroke-width: 2; }
      .box-optional { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 6 4; }
      .arrow { stroke: #64748B; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="920" height="200" rx="16" fill="#F8FAFC"/>
  <text x="460" y="28" text-anchor="middle" class="title">Study model lifecycle</text>

  <rect x="20" y="60" width="88" height="52" rx="10" class="box-accent"/>
  <text x="64" y="84" text-anchor="middle" class="step">Boundary</text>
  <text x="64" y="100" text-anchor="middle" class="optional">Step 1</text>

  <rect x="128" y="60" width="88" height="52" rx="10" class="box"/>
  <text x="172" y="84" text-anchor="middle" class="step">Library</text>
  <text x="172" y="100" text-anchor="middle" class="optional">Step 2</text>

  <rect x="236" y="60" width="88" height="52" rx="10" class="box"/>
  <text x="280" y="84" text-anchor="middle" class="step">Assets</text>
  <text x="280" y="100" text-anchor="middle" class="optional">Step 3</text>

  <rect x="344" y="60" width="88" height="52" rx="10" class="box"/>
  <text x="388" y="84" text-anchor="middle" class="step">Profiles</text>
  <text x="388" y="100" text-anchor="middle" class="optional">Step 4</text>

  <rect x="452" y="60" width="88" height="52" rx="10" class="box"/>
  <text x="496" y="84" text-anchor="middle" class="step">Validate</text>
  <text x="496" y="100" text-anchor="middle" class="optional">5-6</text>

  <rect x="560" y="60" width="88" height="52" rx="10" class="box-accent"/>
  <text x="604" y="84" text-anchor="middle" class="step">Export</text>
  <text x="604" y="100" text-anchor="middle" class="optional">Step 7</text>

  <rect x="668" y="60" width="100" height="52" rx="10" class="box-optional"/>
  <text x="718" y="84" text-anchor="middle" class="step">Aggregate</text>
  <text x="718" y="100" text-anchor="middle" class="optional">optional</text>

  <rect x="788" y="60" width="112" height="52" rx="10" class="box"/>
  <text x="844" y="84" text-anchor="middle" class="step">Analysis tool</text>
  <text x="844" y="100" text-anchor="middle" class="optional">Step 9</text>

  <line x1="108" y1="86" x2="128" y2="86" class="arrow"/>
  <line x1="216" y1="86" x2="236" y2="86" class="arrow"/>
  <line x1="324" y1="86" x2="344" y2="86" class="arrow"/>
  <line x1="432" y1="86" x2="452" y2="86" class="arrow"/>
  <line x1="540" y1="86" x2="560" y2="86" class="arrow"/>
  <line x1="648" y1="86" x2="668" y2="86" class="arrow"/>
  <line x1="768" y1="86" x2="788" y2="86" class="arrow"/>

  <text x="460" y="155" text-anchor="middle" class="optional">Recommended: Workflow, Proxy API, Modeller cheat sheet</text>
  <text x="460" y="175" text-anchor="middle" class="optional">Optional: Building your CESDM Model (notebook or parts)</text>
</svg>
